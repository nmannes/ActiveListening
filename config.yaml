# config.yaml — Single source of truth for all runtime configuration.
# Read by JS (js-yaml), Python (pyyaml), and bash (via get_config.py helper).

# ── Event durations ──────────────────────────────────────────────────────
durations:
  defaultMinutes: 60
  clientFallbackMinutes: 90

# ── Scheduling timing ────────────────────────────────────────────────────
timing:
  schedulePaddingMinutes: 10
  launchBufferMinutes: 10
  startBufferSeconds: 5
  staleThresholdMinutes: 30
  discoveryIntervalMinutes: 60
  maxScheduledFileAgeHours: 24

# ── Lookahead ────────────────────────────────────────────────────────────
lookahead:
  defaultHours: 168

# ── BullMQ worker ────────────────────────────────────────────────────────
worker:
  # Pause run-client jobs live (no restart needed):
  #   redis-cli SET kalshi:run_client_paused 1   # pause — record matches only
  #   redis-cli DEL kalshi:run_client_paused     # resume normal EC2 listening
  cpuThreshold: 0.5
  rescheduleDelayMinutes: 30
  runClientLockDurationHours: 3.5
  logSyncLockDurationMinutes: 10
  schedulingLoopLockDurationMinutes: 10
  transcriptRefreshLockDurationMinutes: 180
  socialFetchLockDurationMinutes: 90
  runClientConcurrency: 5
  logSyncConcurrency: 1
  schedulingLoopConcurrency: 1
  transcriptRefreshConcurrency: 1
  socialFetchConcurrency: 1

# ── Child process supervision ────────────────────────────────────────────
supervisor:
  crashRestartDelayMs: 5000

# ── Server / ports ───────────────────────────────────────────────────────
server:
  wsPort: 8090
  uiPort: 3000
  audioUdpPort: 8092
  tvHeadendPort: 9981
  speakerRecognitionIntervalSecs: 10
  speakerRecognitionMaxDurationSecs: 1200
  audioInboxCapSecs: 60

# ── Redis ────────────────────────────────────────────────────────────────
redis:
  host: "127.0.0.1"
  port: 6379
  cacheTtlSeconds: 604800        # 1 week

# ── API endpoints ────────────────────────────────────────────────────────
api:
  kalshi:
    prod: "https://api.elections.kalshi.com/trade-api/v2"
    demo: "https://demo-api.kalshi.co/trade-api/v2"
    wsProd: "wss://api.elections.kalshi.com/trade-api/ws/v2"
    wsDemo: "wss://demo-api.kalshi.co/trade-api/ws/v2"
  deepgram:
    wsUrl: "wss://api.deepgram.com/v1/listen"

# ── Audio / Deepgram ─────────────────────────────────────────────────────
audio:
  sampleRate: 16000
  channels: 1
  bytesPerSecond: 32000           # sampleRate * 2 bytes (16-bit) * channels
  model: "nova-3"
  vadTurnaroundMs: 10
  endpointingMs: 100
  keepaliveIntervalSecs: 5

# ── AWS / Cloud ──────────────────────────────────────────────────────────
aws:
  region: "us-east-1"
  keyName: "us-east-1"
  s3Bucket: "recordings-846345203908-us-east-1-an"
  deployBucket: "deploys"
  cloudwatchLogGroup: "/kalshi/worker"
  ec2:
    amiId: "ami-04b70fa74e45c3917"   # Ubuntu 24.04
    instanceUser: "ubuntu"
    instanceHome: "/home/ubuntu"
    sshKeyPath: "$HOME/.ssh/us-east-1.pem"
    defaultShutdownMinutes: 70

# ── Trading ──────────────────────────────────────────────────────────────
trading:
  defaultBuyCount: 40
  defaultBuyMaxCost: 5
  defaultLastWordsCount: 7
  defaultDollarAmount: 5.0
  kxwcDollarAmount: 25
  defaultLimitPriceCents: 1
  aggressiveLimitPriceCents: 99
  maxSessionLoss: 500

# ── CLIP / content detection ─────────────────────────────────────────────
clip:
  threshold: 0.55
  defaultProfile: "basketball"

# ── Word prediction ──────────────────────────────────────────────────────
wordPrediction:
  modelId: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  region: "us-east-1"
  cacheSecs: 2.0
  horizonSecs: 60

# ── Speaker recognition ──────────────────────────────────────────────────
speakerRecognition:
  modelId: "us.amazon.nova-lite-v1:0"
  region: "us-east-1"
  maxEmbeddingsPerIdentity: 20    # refs loaded per identity (deterministic selection)

# ── Live speaker ask (unknown speaker → Telegram → human confirms) ───────
speakerAsk:
  enabled: true
  minAudioSecs: 10              # new audio needed before asking about a speaker
  minWords: 8                   # transcript words needed before asking
  perSpeakerCooldownSecs: 300   # don't re-ask about the same speaker
  minGapSecs: 45                # minimum gap between asks in a session
  maxAsksPerSession: 10
  maxCandidates: 8
  askAudioSecs: 10              # OGG clip length sent to Telegram
  retainAudioSecs: 30           # PCM kept in RAM for confirm-time sample curation
  samplesPerConfirm: 3          # max samples saved per human confirmation
  chunkSecs: [3, 6]             # curation chunk length range
  chunkFloor: 0.60              # min cosine to the ask embedding for a chunk
  nearDuplicateCeiling: 0.95    # skip chunks this close to existing library refs
  gif:
    enabled: true
    fps: 4
    width: 320
    bufferSecs: 120             # client-side ring buffer span
    maxSpanSecs: 20             # max video span per GIF
    timeoutSecs: 12             # server wait for the client's GIF
    maxBytes: 5000000
  photos:
    enabled: true
    maxPerAsk: 8

# ── Paths ────────────────────────────────────────────────────────────────
paths:
  python: "/home/nathan/.pyenv/shims/python"
  chrome: "/usr/bin/google-chrome"
  audioLibrary: "~/audio-library"

# ── Puppeteer / scraper defaults ─────────────────────────────────────────
puppeteer:
  pageGotoTimeoutMs: 60000
  pageGotoShortTimeoutMs: 30000
  waitForSelectorTimeoutMs: 15000
  waitForSelectorShortTimeoutMs: 10000

# ── Earnings call source finder ──────────────────────────────────────────
# Claude-based URL picking/verification in lib/scrapers/earnings_source.js.
# When false the finder still searches and scrapes IR pages and matches known
# stream-provider URLs deterministically — it just skips _askClaude, the
# Claude link picks, and verifyUrl.
# Env override: ENABLE_EARNINGS_FINDER_AI=true|false
earnings:
  aiEnabled: false

# ── Provider retry / respawn defaults ────────────────────────────────────
providers:
  ffmpegRespawnDelayMs: 3000
  maxBackoffMs: 10000
  maxYoutubeBackoffMs: 30000

# ── Client connection ────────────────────────────────────────────────────
client:
  wsReconnectDelayMs: 3000
  wsMaxReconnectDurationMs: 120000    # 2 min
  transcriptCheckIntervalMs: 5000
  transcriptTimeoutSec: 1800          # 30 min

# ── Orderbook ────────────────────────────────────────────────────────────
orderbook:
  pingIntervalMs: 10000
  minYesAskPrice: 0.02

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  logDir: "runtime_logs"
  defaultLogLookbackHours: 24
