<!DOCTYPE html>
<html>

<head>
    <title>Audio Streamer</title>
    <style>
        body {
            width: 250px;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        h1 {
            font-size: 18px;
            margin: 0;
            background: linear-gradient(45deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        #start {
            background: #4facfe;
            color: white;
        }

        #start:hover {
            background: #00f2fe;
            transform: translateY(-1px);
        }

        #stop {
            background: #ff4b2b;
            color: white;
        }

        #stop:hover {
            background: #ff416c;
            transform: translateY(-1px);
        }

        .status {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Audio Streamer</h1>
        <button id="start">Start Streaming</button>
        <button id="stop" style="display: none;">Stop Streaming</button>
        <div class="status" id="status">Ready</div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
