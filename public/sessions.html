<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessions</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Menlo', 'Consolas', monospace; background: #0d1117; color: #c9d1d9; padding: 24px; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }

  .nav { margin-bottom: 16px; font-size: 12px; }
  .nav a { color: #8b949e; }
  .nav span { color: #484f58; margin: 0 8px; }

  h1 { font-size: 18px; color: #58a6ff; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #8b949e; margin-bottom: 20px; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .toolbar input { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 12px;
                   border-radius: 6px; font-size: 12px; font-family: inherit; width: 240px; }
  .toolbar input:focus { outline: none; border-color: #58a6ff; }
  .toolbar label { font-size: 11px; color: #8b949e; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .count { font-size: 11px; color: #484f58; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #161b22; color: #8b949e; text-align: left; padding: 10px 12px; border-bottom: 2px solid #30363d;
       font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; cursor: pointer; user-select: none; }
  th:hover { color: #58a6ff; }
  td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
  tr { cursor: pointer; }
  tr:hover td { background: #1c2128; }

  .slug { color: #d2a8ff; font-weight: 600; }
  .ts { font-variant-numeric: tabular-nums; color: #79c0ff; }
  .yes { color: #3fb950; }
  .no { color: #484f58; }

  .loading { text-align: center; padding: 60px; color: #8b949e; font-size: 14px; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #30363d; border-top-color: #58a6ff;
             border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { background: #1c1117; border: 1px solid #f85149; color: #f85149; padding: 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }

  .empty { text-align: center; color: #484f58; padding: 40px; font-size: 13px; }
</style>
</head>
<body>
<div class="nav">
  <a href="/">Market Manager</a><span>/</span><a href="/signals">Signal Dashboard</a><span>/</span><a href="/speakers">Speakers</a><span>/</span><span>Sessions</span>
</div>

<h1>Sessions</h1>
<p class="subtitle">All S3 recording sessions with Deepgram transcripts</p>

<div class="toolbar">
  <input type="text" id="filter" placeholder="Filter by slug or session..." oninput="render()">
  <label><input type="checkbox" id="transcript-only" onchange="render()"> Transcript only</label>
  <span class="count" id="count"></span>
</div>

<div id="content">
  <div class="loading"><span class="spinner"></span>Loading sessions...</div>
</div>

<script>
let sessions = [];

function esc(s) {
  if (typeof s !== 'string') return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmtIso(iso) {
  if (!iso) return '—';
  return iso.replace('T', ' ').replace(/\.\d+Z$/, '');
}

async function load() {
  try {
    const resp = await fetch('/api/sessions');
    if (!resp.ok) {
      document.getElementById('content').innerHTML =
        '<div class="error-box">Failed to load sessions: HTTP ' + resp.status + '</div>';
      return;
    }
    const data = await resp.json();
    sessions = data.sessions;
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="error-box">' + esc(e.message) + '</div>';
  }
}

function render() {
  const filter = document.getElementById('filter').value.toLowerCase();
  const transcriptOnly = document.getElementById('transcript-only').checked;

  let filtered = sessions;
  if (filter) {
    filtered = filtered.filter(s =>
      s.slug.toLowerCase().includes(filter) ||
      s.session.toLowerCase().includes(filter)
    );
  }
  if (transcriptOnly) {
    filtered = filtered.filter(s => s.has_transcript);
  }

  document.getElementById('count').textContent = filtered.length + ' of ' + sessions.length + ' sessions';

  if (sessions.length === 0) {
    document.getElementById('content').innerHTML = '';
    return;
  }

  if (filtered.length === 0) {
    document.getElementById('content').innerHTML =
      '<div class="empty">No sessions match the filter</div>';
    return;
  }

  let html = '<table><thead><tr>' +
    '<th>Slug</th>' +
    '<th>Session</th>' +
    '<th>Session Start</th>' +
    '<th>First DG Response</th>' +
    '<th>DG Count</th>' +
    '<th>View</th>' +
    '</tr></thead><tbody>';

  for (const s of filtered) {
    const sessTsMatch = s.session.match(/_(\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2})$/);
    const sessTs = sessTsMatch ? sessTsMatch[1].replace('_', ' ') : '—';

    const detailUrl = '/session/' + encodeURIComponent(s.slug);
    html += '<tr onclick="window.location=\'' + detailUrl + '\'">' +
      '<td class="slug">' + esc(s.slug) + '</td>' +
      '<td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(s.session) + '">' + esc(s.session) + '</td>' +
      '<td class="ts">' + esc(sessTs) + '</td>' +
      '<td class="ts">' + esc(fmtIso(s.first_timestamp_iso)) + '</td>' +
      '<td>' + s.deepgram_count + '</td>' +
      '<td><a href="/transcript/' + encodeURIComponent(s.session) + '" class="yes" onclick="event.stopPropagation()">view</a>' +
      (s.has_transcript ? '' : ' <span style="font-size:10px;color:#484f58">no t.json</span>') +
      '</td>' +
      '</tr>';
  }

  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

window.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
