<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Logs</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; background: #111; color: #ddd; display: flex; height: 100vh; overflow: hidden; }
#nav-sidebar { width: 180px; min-width: 180px; background: #161616; border-right: 1px solid #333; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; font-size: 12px; }
#nav-sidebar .logo { font-size: 13px; font-weight: 600; color: #68f; margin-bottom: 10px; }
#nav-sidebar a { color: #999; text-decoration: none; padding: 5px 8px; border-radius: 4px; display: block; }
#nav-sidebar a:hover { color: #ddd; background: #252525; }
#nav-sidebar a.active { color: #ddd; background: #252525; }

/* Market list panel */
#sidebar { width: 360px; min-width: 260px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; resize: horizontal; }
#sidebar .header { padding: 10px 16px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
#sidebar .header h2 { font-size: 13px; color: #ddd; margin-bottom: 8px; }
#sidebar .header input { width: 100%; background: #111; border: 1px solid #444; color: #ddd; padding: 6px 10px; font-family: inherit; font-size: 12px; border-radius: 4px; }
#sidebar .header input:focus { border-color: #68f; outline: none; }
#market-list { flex: 1; overflow-y: auto; }
.market-entry { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #222; transition: background .1s; }
.market-entry:hover { background: #252525; }
.market-entry.active { background: #2a3a5c; }
.market-entry .title { font-size: 13px; color: #cde; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.market-entry .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.market-entry .slug { font-size: 10px; color: #68f; background: rgba(102,136,255,0.15); padding: 1px 5px; border-radius: 3px; }
.market-entry .stats { font-size: 10px; color: #777; white-space: nowrap; }
.market-entry .counts { display: flex; gap: 6px; margin-top: 4px; }
.market-entry .count-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
.count-badge.runtime { background: rgba(59,130,246,0.15); color: #93c5fd; }
.count-badge.signals { background: rgba(16,185,129,0.15); color: #6ee7b7; }
.count-badge.orderbook { background: rgba(245,158,11,0.15); color: #fcd34d; }

/* Main viewer */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap; }
#toolbar .filter-tabs { display: flex; gap: 0; border-radius: 4px; overflow: hidden; border: 1px solid #444; }
#toolbar .filter-tab { background: #2a2a2a; color: #999; border: none; padding: 5px 10px; font-family: inherit; font-size: 11px; cursor: pointer; border-right: 1px solid #444; }
#toolbar .filter-tab:last-child { border-right: none; }
#toolbar .filter-tab:hover { background: #333; color: #ddd; }
#toolbar .filter-tab.active { background: #68f; color: #fff; }
#toolbar input { flex: 1; min-width: 120px; background: #111; border: 1px solid #444; color: #ddd; padding: 6px 10px; font-family: inherit; font-size: 13px; border-radius: 4px; }
#toolbar input:focus { border-color: #68f; outline: none; }
#toolbar button { background: #333; color: #ddd; border: 1px solid #444; padding: 6px 12px; font-family: inherit; font-size: 12px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
#toolbar button:hover { background: #444; }
#toolbar .info { font-size: 11px; color: #888; white-space: nowrap; }
#viewer { flex: 1; overflow-y: auto; padding: 0; }
#viewer table { width: 100%; border-collapse: collapse; }
#viewer td { padding: 2px 0; font-size: 12px; line-height: 1.4; vertical-align: top; }
#viewer td.ln { color: #555; text-align: right; padding: 2px 8px 2px 12px; user-select: none; width: 1%; white-space: nowrap; border-right: 1px solid #222; }
#viewer td.type-badge { padding: 2px 8px; width: 1%; white-space: nowrap; text-align: center; }
#viewer td.type-badge span { font-size: 9px; padding: 1px 4px; border-radius: 2px; text-transform: uppercase; }
#viewer td.type-badge span.runtime { background: rgba(59,130,246,0.15); color: #93c5fd; }
#viewer td.type-badge span.signals { background: rgba(16,185,129,0.15); color: #6ee7b7; }
#viewer td.type-badge span.orderbook { background: rgba(245,158,11,0.15); color: #fcd34d; }
#viewer td.content { padding-left: 8px; padding-right: 12px; white-space: pre-wrap; word-break: break-all; }
#viewer tr:hover td { background: #1a1a1a; }
#viewer tr.highlight td.content { background: #332200; }
#viewer tr.highlight td.ln { background: #332200; }
#viewer tr.highlight td.type-badge { background: #332200; }
#info-bar { border-top: 1px solid #333; padding: 8px 12px; font-size: 11px; color: #666; background: #1a1a1a; flex-shrink: 0; display: flex; justify-content: space-between; }
.empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #555; font-size: 14px; flex-direction: column; gap: 8px; }
.spinner { border: 2px solid #333; border-top-color: #68f; border-radius: 50%; width: 16px; height: 16px; animation: spin .6s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="nav-sidebar">
  <div class="logo">Kalshi Market Manager</div>
  <a href="/">🏠 Dashboard</a>
  <a href="/logs">📋 Markets</a>
  <a href="/sessions">📡 Sessions</a>
  <a href="/signals" target="_blank">📈 Signal Dashboard</a>
  <a href="/voice" target="_blank">🎙️ Voice &amp; Data</a>
  <a href="/admin/queues" target="_blank">📊 Queues</a>
</div>

<div id="sidebar">
  <div class="header">
    <h2>Market Logs</h2>
    <input id="market-search" type="text" placeholder="Filter markets...">
  </div>
  <div id="market-list"></div>
</div>

<div id="main">
  <div id="toolbar">
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-type="all">All</button>
      <button class="filter-tab" data-type="runtime">Runtime</button>
      <button class="filter-tab" data-type="signals">Signals</button>
      <button class="filter-tab" data-type="orderbook">Orderbook</button>
    </div>
    <input id="search" type="text" placeholder="Search in logs..." disabled>
    <button id="load-all" disabled>Load all</button>
    <span class="info" id="market-info"></span>
  </div>
  <div id="viewer">
    <div class="empty-state">Select a market to view its logs</div>
  </div>
  <div id="info-bar"><span id="status-text">Ready</span><span id="line-count"></span></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const marketList = $("#market-list");
const viewer = $("#viewer");
const searchInput = $("#search");
const loadAllBtn = $("#load-all");
const marketInfo = $("#market-info");
const statusText = $("#status-text");
const lineCount = $("#line-count");
const marketSearch = $("#market-search");
const filterTabs = $("#filter-tabs");

let activeMarket = null;
let currentLines = [];
let activeType = "all";
let allMarkets = [];

// ── Market list ──────────────────────────────────────────────────────────

async function loadMarketList() {
  try {
    const res = await fetch("/api/market-logs");
    const data = await res.json();
    allMarkets = data.markets || [];
    renderMarketList(allMarkets);

    if (allMarkets.length > 0) {
      statusText.textContent = `${allMarkets.length} markets`;
    } else {
      statusText.textContent = "No market logs yet — run a market session to create logs";
    }
  } catch (e) {
    statusText.textContent = `Error: ${e.message}`;
  }
}

function renderMarketList(markets) {
  const query = marketSearch.value.toLowerCase();
  const filtered = query
    ? markets.filter(m => m.slug.toLowerCase().includes(query) || (m.title && m.title.toLowerCase().includes(query)))
    : markets;

  marketList.innerHTML = "";
  if (filtered.length === 0) {
    marketList.innerHTML = '<div style="padding: 24px 16px; color: #555; font-size: 12px; text-align: center;">' +
      (query ? 'No markets match your filter' : 'No market logs found') + '</div>';
    return;
  }

  for (const m of filtered) {
    const el = document.createElement("div");
    el.className = "market-entry";
    if (activeMarket && activeMarket.slug === m.slug) el.classList.add("active");

    const sizeStr = (bytes) => {
      if (!bytes) return "0";
      if (bytes > 1024*1024) return (bytes/1024/1024).toFixed(1)+"M";
      if (bytes > 1024) return (bytes/1024).toFixed(0)+"K";
      return bytes+"B";
    };

    let countsHtml = "";
    const typeOrder = ["runtime","signals","orderbook"];
    for (const t of typeOrder) {
      if (m.counts[t]) {
        countsHtml += `<span class="count-badge ${t}">${t} ${sizeStr(m.counts[t])}</span>`;
      }
    }

    const timeStr = m.lastActivity
      ? m.lastActivity.replace("T", " ").slice(0, 19)
      : "no activity";

    el.innerHTML = `
      <div class="title">${m.title}</div>
      <div class="meta">
        <span class="slug">${m.slug}</span>
        <span class="stats">${timeStr}</span>
      </div>
      <div class="counts">${countsHtml || '<span class="stats">empty</span>'}</div>
    `;
    el.addEventListener("click", () => selectMarket(m, el));
    marketList.appendChild(el);
  }
}

function selectMarket(market, el) {
  // Update active state
  if (activeMarket && activeMarket.slug === market.slug) return; // already selected
  activeMarket = market;
  $$(".market-entry.active").forEach(e => e.classList.remove("active"));
  if (el) el.classList.add("active");

  // Enable controls
  searchInput.disabled = false;
  loadAllBtn.disabled = false;
  marketInfo.textContent = market.title;

  // Load logs
  loadLogs();
}

marketSearch.addEventListener("input", () => renderMarketList(allMarkets));

// ── Log loading ──────────────────────────────────────────────────────────

async function loadLogs(loadAll) {
  if (!activeMarket) return;

  const linesParam = loadAll ? "lines=100000" : "lines=5000";
  const typeParam = activeType !== "all" ? `&type=${activeType}` : "";
  const searchParam = searchInput.value ? `&search=${encodeURIComponent(searchInput.value)}` : "";

  statusText.textContent = "Loading...";

  try {
    const res = await fetch(`/api/market-logs/${encodeURIComponent(activeMarket.slug)}?${linesParam}${typeParam}${searchParam}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server returned ${res.status}`);
    }
    const data = await res.json();
    currentLines = data.logs || [];
    renderLines(currentLines);
    lineCount.textContent = `${currentLines.length.toLocaleString()} of ${data.total.toLocaleString()} lines`;
    statusText.textContent = "Ready";
  } catch (e) {
    statusText.textContent = `Error: ${e.message}`;
    viewer.innerHTML = `<div class="empty-state">Failed to load: ${e.message}</div>`;
  }
}

function renderLines(lines) {
  viewer.innerHTML = "";
  if (lines.length === 0) {
    viewer.innerHTML = '<div class="empty-state">No log entries match the current filters</div>';
    return;
  }

  const tbody = document.createElement("table");
  let count = 0;
  for (const entry of lines) {
    count++;
    const line = entry.text || "";
    const type = entry.type || "";

    const tr = document.createElement("tr");
    // Line number
    const tdLn = document.createElement("td");
    tdLn.className = "ln";
    tdLn.textContent = count;
    // Type badge
    const tdType = document.createElement("td");
    tdType.className = "type-badge";
    if (type) {
      const span = document.createElement("span");
      span.className = type;
      span.textContent = type.slice(0, 1).toUpperCase();
      tdType.appendChild(span);
    }
    // Content
    const tdContent = document.createElement("td");
    tdContent.className = "content";
    tdContent.textContent = formatLine(line);

    // Search highlight
    if (searchInput.value) {
      const idx = tdContent.textContent.toLowerCase().indexOf(searchInput.value.toLowerCase());
      if (idx >= 0) tr.classList.add("highlight");
    }

    tr.appendChild(tdLn);
    tr.appendChild(tdType);
    tr.appendChild(tdContent);
    tbody.appendChild(tr);
  }
  viewer.appendChild(tbody);
}

function formatLine(line) {
  try {
    const obj = JSON.parse(line);
    const time = obj.time ? obj.time.replace("T", " ").slice(0, 23) : "";
    const msg = obj.msg || obj.message || "";
    return time ? `${time}  ${msg}` : msg || line;
  } catch {
    return line;
  }
}

// ── Controls ─────────────────────────────────────────────────────────────

filterTabs.addEventListener("click", (e) => {
  if (!e.target.classList.contains("filter-tab")) return;
  $$(".filter-tab.active").forEach(t => t.classList.remove("active"));
  e.target.classList.add("active");
  activeType = e.target.dataset.type;
  if (activeMarket) loadLogs();
});

searchInput.addEventListener("input", () => {
  if (activeMarket) loadLogs();
});

loadAllBtn.addEventListener("click", () => {
  if (activeMarket) loadLogs(true);
});

// ── Keyboard shortcut: / to focus search ──────────────────────────────────
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement === document.body) {
    e.preventDefault();
    searchInput.focus();
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
loadMarketList();
</script>
</body>
</html>
