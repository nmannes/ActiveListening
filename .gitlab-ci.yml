server-tests:
  image: python:3.10
  script:
    - pip install pytest pytest-asyncio requests python-dotenv websockets
    - PYTHONPATH=. python -m pytest tests/test_replay_session.py -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID

client-tests:
  image: oven/bun:1
  script:
    - bun install
    - bun test tests/matching.test.js tests/e2e_discovery.test.js tests/speaker_identification.test.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_MERGE_REQUEST_IID
